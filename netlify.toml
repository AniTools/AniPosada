# Netlify builds the static site. The Keystatic CMS only runs locally
# (`npm run dev` → /keystatic) and writes content files into this project;
# pushing to GitHub is what publishes them.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Show calendar files (/shows/<show>.ics) open in Apple Calendar, Outlook, etc.
[[headers]]
  for = "/shows/*"
  [headers.values]
    Content-Type = "text/calendar; charset=utf-8"
